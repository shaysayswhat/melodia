name: Song experiment

on:
  push:
    branches: [exp]
    paths: ["ci/exp_songs_trigger.txt"]

permissions:
  contents: write

jobs:
  songs:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      ACESTEP_REF: 4c75d8b74cd0841353478284c1ca711705f2918c
    steps:
      - uses: actions/checkout@v5
      - name: Start the engine
        env:
          EXTRA_MODELS: acestep-5Hz-lm-1.7B-Q8_0.gguf
        run: bash ci/start_engine.sh
      - name: Make the same songs with and without the songwriter
        env:
          OUT: ${{ github.workspace }}/out
        run: python3 ci/song_experiment.py
      - name: Listen to them
        if: always()
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q faster-whisper || pip install -q --break-system-packages faster-whisper
          python3 ci/analyze_audio.py out 2>&1 | tee out/analysis.log
      - name: Save results
        if: always()
        run: |
          mkdir -p out
          cp "$RUNNER_TEMP/ace/server.log" out/server.log 2>/dev/null || true
          cd out
          git init -q
          git checkout -q -b ci-exp-songs
          git config user.name "melodia-ci"
          git config user.email "melodia-ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Song experiment ${{ github.run_number }}: ${{ job.status }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-exp-songs
