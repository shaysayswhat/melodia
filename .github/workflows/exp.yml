name: Songwriter experiment

on:
  push:
    branches: [exp]

permissions:
  contents: write

jobs:
  lyrics:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      ACESTEP_REF: 4c75d8b74cd0841353478284c1ca711705f2918c
    steps:
      - uses: actions/checkout@v5
      - name: Start the engine
        env:
          EXTRA_MODELS: acestep-5Hz-lm-1.7B-Q8_0.gguf
        run: bash ci/start_engine.sh
      - name: Ask for lyrics in different ways
        env:
          OUT: ${{ github.workspace }}/out
        run: python3 ci/lyrics_experiment.py
      - name: Save results
        if: always()
        run: |
          mkdir -p out
          cp "$RUNNER_TEMP/ace/server.log" out/server.log 2>/dev/null || true
          cd out
          git init -q
          git checkout -q -b ci-exp
          git config user.name "melodia-ci"
          git config user.email "melodia-ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Experiment ${{ github.run_number }}: ${{ job.status }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-exp
