name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      ACESTEP_REF: 4c75d8b74cd0841353478284c1ca711705f2918c
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Find the Android NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            yes | sdkmanager --install "ndk;27.2.12479018" > /dev/null
            NDK="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "NDK: $NDK"

      - name: Restore on-phone engine
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a/libaceserver.so
          key: aceserver-${{ env.ACESTEP_REF }}-${{ hashFiles('native/build_android.sh') }}

      - name: Build on-phone engine (acestep.cpp)
        id: engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: bash native/build_android.sh 2>&1 | tee engine-build.log

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test the app
        run: |
          export MELODIA_VERSION_CODE=${{ github.run_number }}
          export MELODIA_VERSION_NAME="1.0.${{ github.run_number }}"
          ./gradlew --no-daemon --stacktrace :app:testReleaseUnitTest :app:assembleRelease 2>&1 | tee gradle-build.log

      - name: Publish the APK as a release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Melodia.apk
          if [ -f app/src/main/jniLibs/arm64-v8a/libaceserver.so ]; then
            ENGINE="Includes the on-phone engine (Phone AI)."
          else
            ENGINE="This build does NOT include the on-phone engine; use PC AI or the Termux engine."
          fi
          gh release create "v1.0.${{ github.run_number }}" Melodia.apk \
            --title "Melodia 1.0.${{ github.run_number }}" \
            --notes "Open this page on your Android phone, tap Melodia.apk to download, then open it to install. $ENGINE" \
            --latest

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Melodia-apk
          path: Melodia.apk

      - name: Save build logs to the ci-logs branch
        if: always()
        run: |
          mkdir -p /tmp/ci-logs
          for f in engine-build.log gradle-build.log; do
            if [ -f "$f" ]; then tail -n 4000 "$f" > "/tmp/ci-logs/$f"; fi
          done
          {
            echo "run: ${{ github.run_number }}"
            echo "commit: ${{ github.sha }}"
            echo "job: ${{ job.status }}"
            echo "engine-cache-hit: ${{ steps.engine-cache.outputs.cache-hit }}"
            echo "engine-build: ${{ steps.engine.outcome }}"
            ls -la app/src/main/jniLibs/arm64-v8a 2>/dev/null || echo "no engine binary"
          } > /tmp/ci-logs/status.txt
          cd /tmp/ci-logs
          git init -q
          git checkout -q -b ci-logs
          git config user.name "melodia-ci"
          git config user.email "melodia-ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${{ github.run_number }}: ${{ job.status }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
