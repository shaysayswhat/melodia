name: Check with the real engine

# Two end-to-end checks against a real acestep.cpp server running on the CI machine:
#  - engine: the app's client and request builder make real songs (JVM tests)
#  - app: the APK on an Android emulator makes a song through "PC AI"
# Results (logs, screenshots, audio reports) are pushed to the ci-check-* branches.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  ACESTEP_REF: 4c75d8b74cd0841353478284c1ca711705f2918c

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Start the engine
        run: bash ci/start_engine.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Make real songs with the app's engine client
        env:
          ACE_URL: http://127.0.0.1:8085
          ACE_OUT: ${{ github.workspace }}/out/audio
        run: |
          mkdir -p out/audio
          ./gradlew --no-daemon :app:testReleaseUnitTest --tests 'com.melodia.app.engine.EngineIntegrationTest' --rerun 2>&1 | tee out/gradle-test.log

      - name: Listen to the results
        if: always()
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q faster-whisper || pip install -q --break-system-packages faster-whisper
          python3 ci/analyze_audio.py out/audio 2>&1 | tee out/analysis.log

      - name: Save results to the ci-check-engine branch
        if: always()
        run: |
          mkdir -p out
          cp "$RUNNER_TEMP/ace/server.log" out/server.log 2>/dev/null || true
          cp -r app/build/test-results out/test-results 2>/dev/null || true
          echo "run ${{ github.run_number }} commit ${{ github.sha }} job ${{ job.status }}" > out/status.txt
          rm -f out/audio/*.latent
          cd out
          git init -q
          git checkout -q -b ci-check-engine
          git config user.name "melodia-ci"
          git config user.email "melodia-ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Engine check ${{ github.run_number }}: ${{ job.status }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-check-engine

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        run: ./gradlew --no-daemon :app:assembleRelease 2>&1 | tail -n 40

      - name: Start the engine
        run: bash ci/start_engine.sh

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Use the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          OUT: ${{ github.workspace }}/out
          APK: ${{ github.workspace }}/app/build/outputs/apk/release/app-release.apk
          QEMU_AUDIO_DRV: none
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          cores: 2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none -camera-front none
          script: python3 ci/ui_test.py

      - name: Listen to the song the app made
        if: always()
        continue-on-error: true
        run: |
          if ls out/audio/*.mp3 > /dev/null 2>&1; then
            sudo apt-get install -y -qq ffmpeg > /dev/null
            pip install -q faster-whisper || pip install -q --break-system-packages faster-whisper
            python3 ci/analyze_audio.py out/audio 2>&1 | tee out/analysis.log
          fi

      - name: Save results to the ci-check-app branch
        if: always()
        run: |
          mkdir -p out
          cp "$RUNNER_TEMP/ace/server.log" out/server.log 2>/dev/null || true
          echo "run ${{ github.run_number }} commit ${{ github.sha }} job ${{ job.status }}" > out/status.txt
          cd out
          git init -q
          git checkout -q -b ci-check-app
          git config user.name "melodia-ci"
          git config user.email "melodia-ci@users.noreply.github.com"
          git add -A
          git commit -q -m "App check ${{ github.run_number }}: ${{ job.status }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-check-app
