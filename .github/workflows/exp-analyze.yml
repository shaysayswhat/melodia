name: Re-analyze experiment songs

on:
  push:
    branches: [exp]
    paths: ["ci/analyze_trigger.txt"]

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: ci-exp-songs
          path: out
      - name: Listen again
        run: |
          rm -rf out/.git
          sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q faster-whisper || pip install -q --break-system-packages faster-whisper
          python3 ci/analyze_audio.py out 2>&1 | tee out/analysis.log
      - name: Save
        if: always()
        run: |
          cd out
          git init -q
          git checkout -q -b ci-exp-analysis
          git config user.name "melodia-ci"
          git config user.email "melodia-ci@users.noreply.github.com"
          git add report.md analysis.log
          git commit -q -m "Analysis ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-exp-analysis
